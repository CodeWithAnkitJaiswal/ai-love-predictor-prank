<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI - Future Predictor</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-P3PJ90C9NR"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
    
      gtag('config', 'G-P3PJ90C9NR');
    </script>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playwrite+DE+SAS:wght@100..400&family=Roboto:ital,wght@0,100..900;1,100..900&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="container">
        <div class="content">
            <h2 class="title">Cosmic Connections</h2>
            <div class="form">
                <input type="text" placeholder="Enter Your Crush Name">
                <div class="meet">
                    <select id="relation">
                        <option value="">How do you know him/her?</option>
                        <option value="">Classmate</option>
                        <option value="">Neighbour</option>
                        <option value="">Online Friend</option>
                        <option value="">Met in Coaching</option>
                        <option value="">Random Encounter</option>
                    </select>
                </div>
                <div class="meet">
                    <select id="duration">
                        <option value="">How long have you known him/her?</option>
                        <option value="">Just met</option>
                        <option value="">Few months</option>
                        <option value="">1–2 years</option>
                        <option value="">Since childhood</option>
                    </select>
                </div>
                <div class="meet">
                    <select id="firstGlance">
                        <option value="">How did you feel at your first glance with him/her?</option>
                        <option value="butterflies">Butterflies everywhere 🦋</option>
                        <option value="shock">Heart skipped a beat 💓</option>
                        <option value="curious">Instant curiosity 👀</option>
                        <option value="calm">Peaceful & calm 😌</option>
                        <option value="confused">Totally confused 😅</option>
                        <option value="electric">Like an electric shock ⚡</option>
                        <option value="ignore">Pretended not to care 😎</option>
                    </select>
                </div>

                <div class="meet">
                    <select id="frequency">
                        <option value="">How often do you think about him/her?</option>
                        <option value="">Every hour 😳</option>
                        <option value="">Daily ☀️</option>
                        <option value="">Sometimes 🌙</option>
                        <option value="">Never (liar) 😏</option>
                    </select>
                </div>
                <div class="meet" id="convo">
                    <span class="convo">Conversation:</span>
                    <div class="radioBox">
                        <label>
                            <input type="radio" name="conversation" value="yes">
                            Yes
                        </label>
                        <label>
                            <input type="radio" name="conversation" value="no">
                            No
                        </label>
                    </div>
                </div>
                <button type="submit">Check</button>
            </div>
        </div>
    </div>
    <footer>
        <div class="copyright">
            © 2025 Cosmic Connections. All rights reserved.
        </div>
        <div class="creator">
            Made by Ankit Jaiswal & Akshay Kumar.
        </div>
    </footer>
    <script src="script.js"></script>
</body>

</html>
